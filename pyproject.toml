[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adler-fractal"
dynamic = ["version"]
description = "Recursive radial traces and regular polygon endpoint IFS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE_DOCUMENTATION.md"]
requires-python = ">=3.10"
authors = [{name = "Marcus Adler"}]
dependencies = []

[project.optional-dependencies]
render = ["matplotlib>=3.8", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/maadler/adler-fractal"
Report = "https://doi.org/10.5281/zenodo.23057944"

[tool.setuptools.dynamic]
version = {attr = "adler_fractal._version.__version__"}

[tool.setuptools.packages.find]
include = ["adler_fractal*"]
